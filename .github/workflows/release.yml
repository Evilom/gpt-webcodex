name: Build and publish our release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Prepare Windows Python
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/prepare-native-runtime.ps1
      - name: Build Windows installer and updater manifest
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npm run dist
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run test:chat-lifecycle
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Prepare and build Apple Silicon
        if: runner.os == 'macOS'
        run: |
          test "$(uname -m)" = arm64
          npm run resources:mac
          npm run dist:mac
          node scripts/smoke-macos-package.js
          hdiutil verify dist/*-mac-arm64.dmg
          unzip -tq dist/*-mac-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
            dist/*-mac-arm64.dmg
            dist/*-mac-arm64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostics-${{ runner.os }}
          path: build/
          if-no-files-found: ignore

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Verify version and generate checksums
        run: |
          test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
          cp "docs/RELEASE_NOTES_${GITHUB_REF_NAME#v}.md" release-notes.md
          cd release
          sha256sum *.exe *.dmg *.zip latest.yml *.blockmap > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          body_path: release-notes.md
          files: release/*
